<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      background: #0b0e1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ── Animated gradient background ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 50%, rgba(99, 102, 241, 0.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 50%, rgba(236, 72, 153, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 50% 80%, rgba(6, 182, 212, 0.06) 0%, transparent 60%);
      animation: bgShift 12s ease-in-out infinite alternate;
      z-index: 0;
    }

    @keyframes bgShift {
      0%   { transform: scale(1) rotate(0deg); opacity: 0.8; }
      50%  { transform: scale(1.15) rotate(2deg); opacity: 1; }
      100% { transform: scale(1) rotate(-1deg); opacity: 0.8; }
    }

    /* ── Floating orbs ── */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
      animation: orbFloat 18s ease-in-out infinite alternate;
    }
    .orb--1 {
      width: 400px; height: 400px;
      background: rgba(99, 102, 241, 0.15);
      top: -100px; left: -100px;
      animation-delay: -2s;
    }
    .orb--2 {
      width: 300px; height: 300px;
      background: rgba(236, 72, 153, 0.12);
      bottom: -80px; right: -80px;
      animation-delay: -8s;
    }
    .orb--3 {
      width: 250px; height: 250px;
      background: rgba(6, 182, 212, 0.10);
      top: 50%; left: 60%;
      animation-delay: -14s;
    }

    @keyframes orbFloat {
      0%   { transform: translate(0, 0) scale(1); }
      33%  { transform: translate(30px, -40px) scale(1.1); }
      66%  { transform: translate(-20px, 20px) scale(0.9); }
      100% { transform: translate(10px, -30px) scale(1.05); }
    }

    /* ── Particles (CSS only) ── */
    .particle-field {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      animation: particleDrift linear infinite;
    }

    .particle:nth-child(1)  { left: 10%; top: 20%; animation-duration: 14s; animation-delay: -1s; width: 2px; height: 2px; }
    .particle:nth-child(2)  { left: 25%; top: 60%; animation-duration: 18s; animation-delay: -5s; width: 4px; height: 4px; opacity: 0.5; }
    .particle:nth-child(3)  { left: 40%; top: 10%; animation-duration: 16s; animation-delay: -2s; width: 2px; height: 2px; }
    .particle:nth-child(4)  { left: 55%; top: 75%; animation-duration: 20s; animation-delay: -8s; width: 3px; height: 3px; opacity: 0.4; }
    .particle:nth-child(5)  { left: 70%; top: 30%; animation-duration: 15s; animation-delay: -3s; width: 2px; height: 2px; }
    .particle:nth-child(6)  { left: 85%; top: 55%; animation-duration: 17s; animation-delay: -7s; width: 5px; height: 5px; opacity: 0.3; }
    .particle:nth-child(7)  { left: 15%; top: 85%; animation-duration: 22s; animation-delay: -4s; width: 3px; height: 3px; }
    .particle:nth-child(8)  { left: 50%; top: 40%; animation-duration: 13s; animation-delay: -9s; width: 2px; height: 2px; }
    .particle:nth-child(9)  { left: 90%; top: 15%; animation-duration: 19s; animation-delay: -6s; width: 4px; height: 4px; opacity: 0.4; }
    .particle:nth-child(10) { left: 35%; top: 50%; animation-duration: 21s; animation-delay: -11s; width: 2px; height: 2px; }
    .particle:nth-child(11) { left: 5%;  top: 45%; animation-duration: 16s; animation-delay: -3s; width: 3px; height: 3px; opacity: 0.5; }
    .particle:nth-child(12) { left: 75%; top: 80%; animation-duration: 14s; animation-delay: -10s; width: 2px; height: 2px; }
    .particle:nth-child(13) { left: 60%; top: 5%;  animation-duration: 18s; animation-delay: -2s; width: 4px; height: 4px; opacity: 0.3; }
    .particle:nth-child(14) { left: 45%; top: 90%; animation-duration: 20s; animation-delay: -12s; width: 2px; height: 2px; }
    .particle:nth-child(15) { left: 20%; top: 35%; animation-duration: 15s; animation-delay: -5s; width: 3px; height: 3px; }

    @keyframes particleDrift {
      0%   { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(-100vh) translateX(40px) scale(0.5); opacity: 0; }
    }

    /* ── Hero content ── */
    .hero {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
      animation: fadeInUp 1.2s ease-out 0.2s both;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .hello-world {
      font-size: clamp(3.5rem, 12vw, 8rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.03em;
      background: linear-gradient(
        135deg,
        #818cf8 0%,
        #a78bfa 15%,
        #f472b6 30%,
        #fb923c 45%,
        #f472b6 60%,
        #a78bfa 75%,
        #818cf8 90%,
        #a78bfa 100%
      );
      background-size: 300% 300%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: gradientShift 6s ease-in-out infinite, float 4s ease-in-out infinite;
      position: relative;
      display: inline-block;
    }

    /* Glow behind the text */
    .hello-world::after {
      content: 'Hello World';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #818cf8, #f472b6, #818cf8);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: blur(30px) brightness(1.5);
      opacity: 0.4;
      z-index: -1;
      animation: gradientShift 6s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      25%  { background-position: 100% 0%; }
      50%  { background-position: 100% 100%; }
      75%  { background-position: 0% 100%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-12px); }
    }

    /* ── Tagline ── */
    .tagline {
      margin-top: 1.5rem;
      font-size: clamp(1rem, 2.5vw, 1.5rem);
      color: rgba(255, 255, 255, 0.6);
      font-weight: 300;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      animation: fadeInUp 1.2s ease-out 0.6s both;
    }

    /* ── CTA button ── */
    .cta {
      margin-top: 3rem;
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem 2.5rem;
      font-size: 1.05rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      position: relative;
      outline: none;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      animation: fadeInUp 1.2s ease-out 0.9s both;
      text-decoration: none;
    }

    .cta:focus-visible {
      outline: 2px solid #a78bfa;
      outline-offset: 4px;
    }

    .cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(99, 102, 241, 0.35);
    }

    .cta:active {
      transform: translateY(0);
    }

    .cta__arrow {
      display: inline-block;
      transition: transform 0.3s ease;
    }

    .cta:hover .cta__arrow {
      transform: translateX(4px);
    }

    /* ── Success overlay (after form submission) ── */
    .success-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(11, 14, 26, 0.92);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1.5rem;
      animation: fadeIn 0.5s ease-out;
    }

    .success-overlay.visible {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .success-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #a78bfa);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      color: #fff;
      animation: bounceIn 0.6s ease-out;
    }

    @keyframes bounceIn {
      0%   { transform: scale(0); }
      50%  { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    .success-message {
      color: rgba(255, 255, 255, 0.9);
      font-size: 1.25rem;
      font-weight: 300;
    }

    .success-close {
      margin-top: 1rem;
      padding: 0.75rem 2rem;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50px;
      cursor: pointer;
      font-size: 0.95rem;
      outline: none;
      transition: background 0.2s;
    }

    .success-close:focus-visible {
      outline: 2px solid #a78bfa;
      outline-offset: 4px;
    }

    .success-close:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    /* ── Footer ── */
    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1;
      text-align: center;
      padding: 1.5rem 2rem;
      color: rgba(255, 255, 255, 0.2);
      font-size: 0.8rem;
      letter-spacing: 0.05em;
      animation: fadeInUp 1.2s ease-out 1.2s both;
    }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      .hello-world {
        font-size: clamp(2.8rem, 15vw, 4.5rem);
      }
      .cta {
        padding: 0.875rem 2rem;
        font-size: 0.95rem;
      }
      .orb--1 { width: 250px; height: 250px; }
      .orb--2 { width: 200px; height: 200px; }
      .orb--3 { width: 180px; height: 180px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- Orbs -->
  <div class="orb orb--1"></div>
  <div class="orb orb--2"></div>
  <div class="orb orb--3"></div>

  <!-- Particles -->
  <div class="particle-field">
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
    <div class="particle"></div>
  </div>

  <!-- Hero -->
  <main class="hero">
    <h1 class="hello-world">Hello World</h1>
    <p class="tagline">A bold new beginning</p>
    <button class="cta" id="ctaButton" aria-label="Get started">
      Get Started
      <span class="cta__arrow">→</span>
    </button>
  </main>

  <!-- Footer -->
  <footer class="footer">
    &copy; 2024 Hello World. All rights reserved.
  </footer>

  <!-- Success overlay -->
  <div class="success-overlay" id="successOverlay" role="dialog" aria-modal="true" aria-label="Welcome">
    <div class="success-icon">✦</div>
    <p class="success-message">Welcome aboard! 🎉</p>
    <button class="success-close" id="successClose">Got it</button>
  </div>

  <script>
    (function () {
      const cta = document.getElementById('ctaButton');
      const overlay = document.getElementById('successOverlay');
      const closeBtn = document.getElementById('successClose');

      function showSuccess() {
        overlay.classList.add('visible');
        closeBtn.focus();
      }

      function hideSuccess() {
        overlay.classList.remove('visible');
        cta.focus();
      }

      cta.addEventListener('click', function (e) {
        e.preventDefault();
        showSuccess();
      });

      closeBtn.addEventListener('click', hideSuccess);

      // Close on Escape
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && overlay.classList.contains('visible')) {
          hideSuccess();
        }
      });

      // Close on backdrop click
      overlay.addEventListener('click', function (e) {
        if (e.target === overlay) {
          hideSuccess();
        }
      });
    })();
  </script>

</body>
</html>
